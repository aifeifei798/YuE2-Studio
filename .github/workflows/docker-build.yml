# 手动构建并推送 Docker 镜像到 GHCR。
# 用法：GitHub 仓库页 → Actions → "Docker 镜像构建" → Run workflow，填 tag 即可。
# 产物：ghcr.io/<owner>/yue2-api、yue2-web（compose 用）、yue2-allinone（单镜像）。
# 部署机在 .env 里设 YUE2_API_IMAGE / YUE2_WEB_IMAGE 后 `docker compose pull && docker compose up -d`。
name: Docker 镜像构建

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 镜像 tag（如 latest、v1.0.0）
        required: true
        default: latest
      push:
        description: 推送到 GHCR（关掉则只验证构建）
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR 仓库名必须全小写
      - id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # compose 的 api 服务：构建上下文为仓库根
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ steps.repo.outputs.owner }}/yue2-api:${{ inputs.tag }}

      # compose 的 web 服务：多阶段构建（node build → nginx），无需本地 dist
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ steps.repo.outputs.owner }}/yue2-web:${{ inputs.tag }}

      # 单机 all-in-one 镜像
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ steps.repo.outputs.owner }}/yue2-allinone:${{ inputs.tag }}
