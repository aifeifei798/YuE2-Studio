server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API 与音频反代到后端 api:8000（compose 内网），避免浏览器 CORS；
  # 透传真实 IP 供后端按 IP 限流
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /audio/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location = /healthz { proxy_pass http://api:8000; }

  # Hash 路由（#/admin）无需 fallback，但保留直接访问 /admin 兜底到 index
  location = /admin { return 302 /#/admin; }
  location / { try_files $uri /index.html; }
}
