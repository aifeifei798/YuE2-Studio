<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YuE2 AI 音乐工坊 - Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    body {
      background: radial-gradient(circle at 15% 15%, #151828 0%, #0a0c13 50%, #07080c 100%);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    .glass-panel {
      background: rgba(16, 20, 34, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .glass-input {
      background: rgba(9, 12, 22, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.09);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-input:focus {
      background: rgba(11, 15, 28, 0.95);
      border-color: rgba(168, 85, 247, 0.6);
      box-shadow: 0 0 15px -3px rgba(168, 85, 247, 0.25);
    }

    /* 歌词编辑器专属呼吸光圈与背景微网格 */
    .editor-canvas {
      background-color: rgba(8, 10, 18, 0.9);
      background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .btn-gradient {
      background: linear-gradient(135deg, #7e22ce 0%, #6366f1 50%, #3b82f6 100%);
      box-shadow: 0 4px 20px -2px rgba(99, 102, 241, 0.4);
    }

    .btn-gradient:hover {
      box-shadow: 0 6px 25px 0px rgba(126, 34, 206, 0.5);
      filter: brightness(1.08);
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
  </style>
</head>
<body class="text-slate-200 h-screen overflow-hidden flex flex-col p-3 md:p-4">

  <!-- 顶部轻奢导航栏 -->
  <header class="w-full max-w-[1780px] mx-auto flex items-center justify-between pb-3 px-1 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-purple-500/20 to-indigo-500/10 border border-purple-500/30 flex items-center justify-center text-purple-400 text-sm shadow-[0_0_12px_rgba(168,85,247,0.2)]">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-white tracking-tight flex items-center gap-2">
          YuE2 Studio
          <span class="text-[10px] font-medium tracking-wide uppercase px-2 py-0.5 rounded-full bg-purple-500/10 text-purple-300 border border-purple-500/20">3B Pro Engine</span>
        </h1>
      </div>
    </div>
    <div class="flex items-center gap-4 text-xs font-mono">
      <div class="flex items-center gap-2 bg-slate-900/80 px-2.5 py-1 rounded-full border border-slate-800">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-slate-400 text-[11px]">127.0.0.1:8000</span>
      </div>
    </div>
  </header>

  <!-- 主体工作区：黄金分割三栏严格等高对齐 -->
  <main class="w-full max-w-[1780px] mx-auto flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-12 gap-3.5 items-stretch">

    <!-- ════════════ 第 1 栏 (左侧 5 列)：沉浸式巨幅创作区 ════════════ -->
    <section class="lg:col-span-5 glass-panel p-4 rounded-2xl flex flex-col h-full min-h-0">

      <!-- 1. 歌曲标题行 (标签在外、带图标) -->
      <div class="mb-2.5 shrink-0">
        <div class="flex items-center justify-between mb-1">
          <label class="text-[11px] font-semibold uppercase text-slate-300 flex items-center gap-1.5">
            <i class="fa-solid fa-heading text-purple-400"></i> 歌曲标题 (Title)
          </label>
          <button id="loadPresetBtn" class="text-[10px] bg-purple-500/10 hover:bg-purple-500/20 text-purple-300 px-2.5 py-0.5 rounded-lg border border-purple-500/25 transition flex items-center gap-1">
            <i class="fa-solid fa-bookmark"></i> 填入《今晚不眠》
          </button>
        </div>
        <input id="titleInput" type="text" placeholder="给你的歌曲起个名字..." class="w-full glass-input rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none placeholder-slate-600">
      </div>

      <!-- 2. 种子 (Seed) 与 思维链 (CoT) 并排独立卡片排 (规范化标签在外 + 专属图标) -->
      <div class="grid grid-cols-2 gap-3 mb-2.5 shrink-0">
        <!-- 种子 Seed -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-[11px] font-semibold uppercase text-slate-300 flex items-center gap-1.5">
              <i class="fa-solid fa-dice-d20 text-amber-400"></i> 随机种子 (Seed)
            </label>
            <button id="randSeedBtn" type="button" class="text-[10px] text-amber-400/90 hover:text-amber-300 flex items-center gap-1 hover:underline transition">
              <i class="fa-solid fa-shuffle"></i> 随机
            </button>
          </div>
          <input id="seedInput" type="number" placeholder="留空则自动随机生成" class="w-full glass-input rounded-xl px-3 py-1.5 text-xs text-amber-300 font-mono focus:outline-none placeholder-slate-600">
        </div>

        <!-- 思维链 CoT -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-[11px] font-semibold uppercase text-slate-300 flex items-center gap-1.5">
              <i class="fa-solid fa-brain text-indigo-400"></i> 思维模式 (CoT)
            </label>
            <span class="text-[10px] text-slate-500 font-mono">Chain-of-Thought</span>
          </div>
          <select id="cotInput" class="w-full glass-input rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none cursor-pointer">
            <option value="full" class="bg-slate-900">Full (推荐完整模式)</option>
            <option value="none" class="bg-slate-900">None (直出快速模式)</option>
          </select>
        </div>
      </div>

      <!-- 3. 曲风描述 Style Prompt -->
      <div class="mb-2.5 shrink-0">
        <div class="flex items-center justify-between mb-1">
          <label class="text-[11px] font-semibold uppercase text-slate-300 flex items-center gap-1.5">
            <i class="fa-solid fa-guitar text-cyan-400"></i> 曲风描述 (Style Prompt)
          </label>
          <span class="text-[10px] text-slate-500">乐器 / 节奏 / 情绪</span>
        </div>
        <textarea id="styleInput" rows="2" placeholder="City Pop, upbeat, danceable, groovy bass, electric guitar, synth..." class="w-full glass-input rounded-xl p-2 text-xs text-slate-200 focus:outline-none resize-none leading-relaxed placeholder-slate-600"></textarea>
      </div>

      <!-- 4. 歌词编辑核心大区 (flex-1 纵向拉满) -->
      <div class="flex-1 min-h-0 flex flex-col mb-3">
        <div class="flex items-center justify-between mb-1 shrink-0">
          <label class="text-[11px] font-semibold uppercase text-slate-300 flex items-center gap-1.5">
            <i class="fa-solid fa-feather-pointed text-fuchsia-400"></i> 歌词排版 (含结构标签 如 [Verse], [Chorus])
          </label>
          <span id="lyricStats" class="text-[10px] text-slate-500 font-mono">0 行 · 0 字</span>
        </div>
        <!-- 沉浸式大画布 -->
        <div class="flex-1 min-h-0 relative rounded-xl border border-white/10 overflow-hidden focus-within:border-purple-500/60 transition shadow-inner">
          <textarea id="lyricsInput" placeholder="[Intro]&#10;&#10;[Verse]&#10;路灯眨着眼睛 偷看谁的身影&#10;街道哼着小调 节奏多轻盈...&#10;&#10;[Chorus]&#10;今晚不眠 快乐无限..." class="w-full h-full editor-canvas p-3 font-mono-code text-xs text-purple-100/90 leading-relaxed resize-none focus:outline-none overflow-y-auto"></textarea>
        </div>
      </div>

      <!-- 5. 吸底主生成按钮 -->
      <div class="shrink-0">
        <button id="submitBtn" class="w-full py-2.5 px-6 rounded-xl font-bold text-white btn-gradient transition-all duration-200 flex items-center justify-center gap-2 text-xs md:text-sm tracking-wide active:scale-[0.99]">
          <i class="fa-solid fa-compact-disc"></i> 开始生成全曲
        </button>
      </div>
    </section>

    <!-- ════════════ 第 2 栏 (中间 4 列)：监听播放与档案展示 ════════════ -->
    <section class="lg:col-span-4 flex flex-col h-full min-h-0 gap-3">

      <!-- 播放器卡片 (精致置顶) -->
      <div class="glass-panel p-3.5 rounded-2xl flex flex-col shrink-0">
        <div class="flex items-center gap-3 w-full">
          <div id="cdDisc" class="w-14 h-14 rounded-full border-2 border-slate-700 bg-slate-950 flex items-center justify-center shadow-lg relative shrink-0">
            <div class="w-5 h-5 rounded-full border border-purple-500/50 bg-slate-900 flex items-center justify-center">
              <i class="fa-solid fa-music text-purple-400 text-[10px]"></i>
            </div>
          </div>
          <div class="overflow-hidden flex-1 text-left">
            <h3 id="displayTitle" class="text-sm font-bold text-white truncate">等待聆听</h3>
            <p id="displaySeedBadge" class="text-[10px] text-purple-300 font-mono truncate">右侧点击曲目立即载入</p>
          </div>
          <a id="downloadLink" href="#" download class="hidden p-2.5 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition items-center justify-center shrink-0" title="下载无损 FLAC">
            <i class="fa-solid fa-download text-xs"></i>
          </a>
        </div>
        <audio id="audioPlayer" controls class="w-full mt-2.5 h-8"></audio>
      </div>

      <!-- 本曲制作信息档案 (弹性撑满，内部滚动) -->
      <div id="metaPanel" class="glass-panel p-3.5 rounded-2xl flex-1 min-h-0 flex flex-col gap-2">
        <div class="flex items-center justify-between border-b border-slate-700/40 pb-1.5 shrink-0">
          <h4 class="text-[11px] font-bold uppercase text-slate-300 tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-circle-info text-cyan-400"></i> 本曲制作档案
          </h4>
          <button id="reuseConfigBtn" class="hidden text-[10px] text-purple-300 hover:text-white bg-purple-950/60 hover:bg-purple-900/80 px-2.5 py-1 rounded-lg border border-purple-500/30 transition">
            <i class="fa-solid fa-arrow-left mr-1"></i> 回填参数
          </button>
        </div>

        <div class="grid grid-cols-2 gap-1.5 text-[10px] bg-slate-950/70 p-2 rounded-xl border border-slate-800/80 shrink-0 font-mono">
          <div><span class="text-slate-500">制作种子：</span><span id="metaSeed" class="text-amber-400 font-bold">-</span></div>
          <div><span class="text-slate-500">思维模式：</span><span id="metaCot" class="text-slate-300">-</span></div>
          <div class="col-span-2 truncate"><span class="text-slate-500">制作时间：</span><span id="metaTime" class="text-slate-400">-</span></div>
        </div>

        <div class="shrink-0">
          <span class="text-[10px] font-semibold uppercase text-slate-400 block mb-0.5">当时的风格 (Style)</span>
          <div id="metaStyle" class="text-[11px] text-slate-300 bg-slate-950/60 border border-slate-800/80 p-2 rounded-xl max-h-16 overflow-y-auto whitespace-pre-wrap leading-relaxed">-</div>
        </div>

        <div class="flex-1 min-h-0 flex flex-col">
          <span class="text-[10px] font-semibold uppercase text-slate-400 block mb-0.5 shrink-0">当时的完整歌词 (Lyrics)</span>
          <div id="metaLyrics" class="flex-1 min-h-0 text-[11px] text-slate-300 font-mono-code bg-slate-950/60 border border-slate-800/80 p-2.5 rounded-xl overflow-y-auto whitespace-pre-wrap leading-relaxed">-</div>
        </div>
      </div>

      <!-- 控制台日志 (置底) -->
      <div class="glass-panel p-2.5 rounded-2xl flex flex-col shrink-0">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[10px] font-bold uppercase text-slate-400"><i class="fa-solid fa-terminal text-emerald-400 mr-1"></i> 控制台日志</span>
          <button id="clearLogBtn" class="text-[9px] text-slate-500 hover:text-slate-300">清屏</button>
        </div>
        <div id="statusBox" class="h-14 bg-slate-950/90 rounded-xl p-2 font-mono text-[10px] text-slate-400 overflow-y-auto space-y-0.5 border border-slate-800">
          <div>[Ready] 系统就绪，等待指令</div>
        </div>
      </div>

    </section>

    <!-- ════════════ 第 3 栏 (右侧 3 列)：独立固定高度媒体库 ════════════ -->
    <section class="lg:col-span-3 glass-panel p-3.5 rounded-2xl flex flex-col h-full min-h-0">

      <div class="flex items-center justify-between pb-2 border-b border-slate-700/40 shrink-0">
        <h4 class="text-xs font-bold uppercase text-slate-300 tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-clock-rotate-left text-purple-400"></i> 创作历史 (<span id="historyCount">0</span>)
        </h4>
        <button id="refreshBtn" title="刷新历史" class="text-slate-400 hover:text-white text-xs transition p-1">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>

      <div class="mt-2 mb-2 relative shrink-0">
        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-500 text-[11px]"></i>
        <input id="searchInput" type="text" placeholder="搜索歌名或 Seed..." class="w-full glass-input rounded-xl pl-7 pr-2.5 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none">
      </div>

      <div id="historyList" class="flex-1 min-h-0 overflow-y-auto space-y-1.5 pr-1 mt-0.5">
        <div class="text-xs text-slate-500 text-center py-6">暂无历史记录</div>
      </div>
    </section>

  </main>

  <script>
    const API_BASE = window.location.origin.startsWith("http")
      ? window.location.origin
      : "http://127.0.0.1:8000";

    const samplePreset = {
      title: "今晚不眠",
      style: "City Pop, upbeat, danceable, groovy bass\nelectric guitar, synth, energetic, joyful\nneon city night, emotional male vocal",
      lyrics: "[Intro]\n\n[Verse]\n路灯眨着眼睛 偷看谁的身影\n街道哼着小调 节奏多轻盈\n晚风染成霓虹 吹乱发际线\n脚步踩着鼓点 不需要终点\n\n[Pre-Chorus]\n旋转的唱片 划破了寂静\n气泡在上升 快乐在飞行\n把烦恼抛去 别再去在意\n这里的空气 充满了魔力\n\n[Chorus]\n今晚不眠 快乐无限\n城市在狂欢 我们在中间\n自由摇摆 光芒盛开\n跟着这节拍 把心打开\n\n[Outro]\n霓虹色的风 吹向那梦\n摇摆\n闪耀\nYeah",
      cot: "full",
      seed: 12300
    };

    let historyRecords = [];
    let currentItem = null;

    // DOM 元素
    const titleInput = document.getElementById("titleInput");
    const styleInput = document.getElementById("styleInput");
    const lyricsInput = document.getElementById("lyricsInput");
    const lyricStats = document.getElementById("lyricStats");
    const seedInput = document.getElementById("seedInput");
    const cotInput = document.getElementById("cotInput");
    const randSeedBtn = document.getElementById("randSeedBtn");
    const submitBtn = document.getElementById("submitBtn");
    const statusBox = document.getElementById("statusBox");
    const audioPlayer = document.getElementById("audioPlayer");
    const downloadLink = document.getElementById("downloadLink");
    const cdDisc = document.getElementById("cdDisc");
    const historyList = document.getElementById("historyList");
    const historyCount = document.getElementById("historyCount");
    const searchInput = document.getElementById("searchInput");
    const refreshBtn = document.getElementById("refreshBtn");

    // 制作档案 DOM
    const metaSeed = document.getElementById("metaSeed");
    const metaCot = document.getElementById("metaCot");
    const metaTime = document.getElementById("metaTime");
    const metaStyle = document.getElementById("metaStyle");
    const metaLyrics = document.getElementById("metaLyrics");
    const reuseConfigBtn = document.getElementById("reuseConfigBtn");

    function log(msg, color = "text-slate-400") {
      const el = document.createElement("div");
      el.className = color;
      el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      statusBox.appendChild(el);
      statusBox.scrollTop = statusBox.scrollHeight;
    }

    function updateLyricStats() {
      const text = lyricsInput.value;
      const lines = text ? text.split("\n").length : 0;
      const chars = text.replace(/\s/g, "").length;
      lyricStats.textContent = `${lines} 行 · ${chars} 字`;
    }
    lyricsInput.addEventListener("input", updateLyricStats);

    document.getElementById("clearLogBtn").addEventListener("click", () => statusBox.innerHTML = "");

    // 随机种子按钮
    randSeedBtn.addEventListener("click", () => {
      seedInput.value = Math.floor(Math.random() * 2147483647);
      log(`摇得新种子: ${seedInput.value}`, "text-purple-400");
    });

    // 填入预设
    document.getElementById("loadPresetBtn").addEventListener("click", () => {
      titleInput.value = samplePreset.title;
      styleInput.value = samplePreset.style;
      lyricsInput.value = samplePreset.lyrics;
      cotInput.value = samplePreset.cot;
      seedInput.value = samplePreset.seed;
      updateLyricStats();
      log("已填入《今晚不眠》预设", "text-purple-400");
    });

    // 回填制作参数
    reuseConfigBtn.addEventListener("click", () => {
      if (!currentItem) return;
      titleInput.value = currentItem.title || "";
      styleInput.value = currentItem.style || "";
      lyricsInput.value = currentItem.lyrics || "";
      cotInput.value = currentItem.cot || "full";
      seedInput.value = currentItem.seed !== undefined ? currentItem.seed : "";
      updateLyricStats();
      log(`已将《${currentItem.title}》的制作参数回填到左侧！`, "text-cyan-400");
    });

    // 播放并在中间面板展开档案
    function playAndShowDetails(item) {
      currentItem = item;
      const finalAudioUrl = item.audio_url.startsWith("http") ? item.audio_url : `${API_BASE}${item.audio_url}`;

      document.getElementById("displayTitle").textContent = item.title;
      document.getElementById("displaySeedBadge").textContent = `Seed: ${item.seed !== undefined ? item.seed : '未记录'}`;
      audioPlayer.src = finalAudioUrl;
      audioPlayer.play().catch(() => {});

      downloadLink.href = finalAudioUrl;
      downloadLink.download = `${item.title}.flac`;
      downloadLink.classList.remove("hidden");
      downloadLink.classList.add("flex");

      // 呈现制作档案
      metaSeed.textContent = item.seed !== undefined ? item.seed : "未记录";
      metaCot.textContent = item.cot || "full";
      metaTime.textContent = item.created_at || "未知";
      metaStyle.textContent = item.style || "无";
      metaLyrics.textContent = item.lyrics || "无歌词记录";
      reuseConfigBtn.classList.remove("hidden");

      renderHistory();
      log(`正在播放: 《${item.title}》`, "text-cyan-400");
    }

    // 渲染历史列表
    function renderHistory() {
      historyCount.textContent = historyRecords.length;
      const keyword = searchInput.value.trim().toLowerCase();

      const displayList = historyRecords.filter(item => {
        if (!keyword) return true;
        const titleMatch = (item.title || "").toLowerCase().includes(keyword);
        const seedMatch = String(item.seed || "").includes(keyword);
        return titleMatch || seedMatch;
      });

      if (displayList.length === 0) {
        historyList.innerHTML = `<div class="text-xs text-slate-500 text-center py-6">无匹配的曲目</div>`;
        return;
      }

      historyList.innerHTML = displayList.map(item => {
        const isPlaying = currentItem && item.task_id === currentItem.task_id;
        const activeClass = isPlaying
          ? "bg-purple-900/40 border-purple-500/80 shadow-[0_0_12px_rgba(168,85,247,0.3)] ring-1 ring-purple-500/50"
          : "bg-slate-900/60 border-slate-800/90 hover:border-slate-700 hover:bg-slate-800/60";

        return `
          <div onclick='handleHistoryClick("${item.task_id}")'
               class="cursor-pointer group flex items-center justify-between p-2 rounded-xl border ${activeClass} transition-all duration-150">
            <div class="flex items-center gap-2 overflow-hidden">
              <div class="w-6 h-6 rounded-lg ${isPlaying ? 'bg-purple-600 text-white animate-pulse' : 'bg-slate-800 text-purple-400 group-hover:bg-purple-600 group-hover:text-white'} flex items-center justify-center text-[10px] shrink-0 transition">
                <i class="fa-solid ${isPlaying ? 'fa-volume-high' : 'fa-play'}"></i>
              </div>
              <div class="overflow-hidden">
                <div class="text-xs font-semibold text-white truncate group-hover:text-purple-300 transition">${item.title}</div>
                <div class="text-[10px] text-slate-500 truncate font-mono">Seed: ${item.seed !== undefined ? item.seed : '-'}</div>
              </div>
            </div>
            <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 shrink-0">听歌</span>
          </div>
        `;
      }).join('');
    }

    searchInput.addEventListener("input", renderHistory);
    refreshBtn.addEventListener("click", loadHistory);

    window.handleHistoryClick = (taskId) => {
      const found = historyRecords.find(x => x.task_id === taskId);
      if (found) playAndShowDetails(found);
    };

    async function loadHistory() {
      try {
        const res = await fetch(`${API_BASE}/api/history`);
        if (res.ok) {
          historyRecords = await res.json();
          renderHistory();
          if (historyRecords.length > 0 && !currentItem) {
            const latest = historyRecords[0];
            metaSeed.textContent = latest.seed !== undefined ? latest.seed : "未记录";
            metaCot.textContent = latest.cot || "full";
            metaTime.textContent = latest.created_at || "未知";
            metaStyle.textContent = latest.style || "无";
            metaLyrics.textContent = latest.lyrics || "无歌词记录";
            reuseConfigBtn.classList.remove("hidden");
            document.getElementById("displayTitle").textContent = latest.title;
            document.getElementById("displaySeedBadge").textContent = `Seed: ${latest.seed !== undefined ? latest.seed : '未记录'}`;
          }
        }
      } catch (e) {
        log(`拉取历史失败: ${e.message}`, "text-rose-400");
      }
    }

    audioPlayer.addEventListener("play", () => cdDisc.classList.add("animate-spin"));
    audioPlayer.addEventListener("pause", () => cdDisc.classList.remove("animate-spin"));
    audioPlayer.addEventListener("ended", () => cdDisc.classList.remove("animate-spin"));

    // 提交任务
    submitBtn.addEventListener("click", async () => {
      const seedVal = seedInput.value.trim();
      const payload = {
        title: titleInput.value.trim() || "未命名歌曲",
        style: styleInput.value.trim(),
        lyrics: lyricsInput.value.trim(),
        cot: cotInput.value,
        seed: seedVal === "" ? null : parseInt(seedVal)
      };

      if (!payload.style || !payload.lyrics) {
        alert("曲风描述 (Style) 和 歌词 (Lyrics) 为必填项！");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add("opacity-50", "cursor-not-allowed");
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 正在创作全曲 (1~3分钟)...`;
      cdDisc.classList.add("animate-spin");
      log(`🚀 提交创作: 《${payload.title}》${payload.seed === null ? ' (模式: 随机种子)' : ` (Seed: ${payload.seed})`}`, "text-yellow-400");

      try {
        const resp = await fetch(`${API_BASE}/api/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({}));
          throw new Error(errData.detail || `服务端错误 (HTTP ${resp.status})`);
        }

        const data = await resp.json();
        log(`🎉 创作成功！实际使用的随机种子为: ${data.seed}`, "text-emerald-400");

        historyRecords.unshift(data);
        renderHistory();
        playAndShowDetails(data);

      } catch (err) {
        log(`❌ 失败: ${err.message}`, "text-rose-400");
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove("opacity-50", "cursor-not-allowed");
        submitBtn.innerHTML = `<i class="fa-solid fa-compact-disc"></i> 开始生成全曲`;
        if (audioPlayer.paused) cdDisc.classList.remove("animate-spin");
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      loadHistory();
      updateLyricStats();
    });
  </script>
</body>
</html>
